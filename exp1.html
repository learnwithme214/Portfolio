<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio | AI & Robotics</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0b0f19;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
}

header {
    padding: 40px 8% 0;
    background: transparent;
    border: 0;
}

header h1 {
    font-size: 38px;
    color: white;
}

header p {
    margin-top: 12px;
    color: #9ca3af;
    line-height: 1.7;
}

main {
    padding: 40px 8%;
}

.section-title {
    font-size: 25px;
    margin-bottom: 25px;
}

.projects {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
    gap: 22px;
}

.project-card {
    background: #151d2b;
    border: 1px solid #263244;
    border-radius: 12px;
    padding: 23px;
    cursor: pointer;
    transition: 0.2s;
}

.project-card:hover {
    transform: translateY(-5px);
    border-color: #3b82f6;
}

.project-card h3 {
    margin-bottom: 12px;
    color: #60a5fa;
}

.project-card p {
    color: #9ca3af;
    line-height: 1.6;
    font-size: 14px;
}

.tags {
    margin-top: 18px;
}

.tag {
    display: inline-block;
    background: #25334a;
    color: #93c5fd;
    padding: 5px 9px;
    border-radius: 5px;
    margin: 3px;
    font-size: 12px;
}

.details {
    display: none;
    margin-top: 35px;
    background: #151d2b;
    border: 1px solid #3b82f6;
    border-radius: 12px;
    padding: 25px;
}

.details h2 {
    color: #60a5fa;
    margin-bottom: 15px;
}

.details p {
    color: #cbd5e1;
    line-height: 1.8;
}

.details h3 {
    margin: 25px 0 12px;
}

.file-list {
    list-style: none;
}

.file-list li {
    padding: 12px;
    background: #202c3d;
    margin: 8px 0;
    border-radius: 6px;
}

.file-list a {
    color: #93c5fd;
    text-decoration: none;
}

.file-list a:hover {
    text-decoration: underline;
}

.close {
    margin-top: 25px;
    background: #263244;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #6b7280;
    border-top: 1px solid #263244;
}

/* Organised portfolio sections - keeps the existing dark theme */
.info-section {
    margin-bottom: 42px;
    padding: 25px;
    background: #111827;
    border: 1px solid #263244;
    border-radius: 12px;
}

.info-section p {
    color: #9ca3af;
    line-height: 1.8;
    margin-top: 10px;
}

.skills-list {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 16px;
}

.experience-item {
    margin-top: 18px;
    padding: 17px;
    background: #151d2b;
    border-left: 3px solid #3b82f6;
    border-radius: 7px;
}

.experience-item h3 {
    color: #60a5fa;
    margin-bottom: 7px;
}

@media (max-width:600px) {
    .info-section { padding: 19px; margin-bottom: 28px; }
}

.profile-intro {
    display:flex; align-items:center; gap:28px;
    width:100%; max-width:100%; margin:0 auto;
    padding:23px;
    background:#151d2b;
    border:1px solid #263244;
    border-radius:12px;
}
.profile-photo {
    width:180px; height:220px; object-fit:cover; object-position:center 38%;
    border-radius:12px; border:2px solid #263244; flex-shrink:0;
}
.profile-text h1 { font-size:38px; color:white; }
.profile-text .role { margin-top:10px; color:#60a5fa; font-size:18px; font-weight:bold; }
.profile-text p { margin-top:10px; color:#9ca3af; line-height:1.7; }
@media (max-width:600px) {
    header { padding:24px 5% 0; }
    .profile-intro { align-items:flex-start; gap:18px; padding:19px; }
    .profile-photo { width:118px; height:150px; }
    .profile-text h1 { font-size:27px; }
    .profile-text .role { font-size:15px; }
    .profile-text p { font-size:13px; }
}


/* Interactive About section */
.about-experience{display:grid;grid-template-columns:minmax(260px, .82fr) minmax(0,1.6fr);gap:clamp(28px,5vw,72px);align-items:center;margin:0 0 48px;padding:clamp(24px,4vw,48px);background:radial-gradient(circle at 18% 45%,#1b3150 0,#111827 43%,#0f1725 100%);border:1px solid #263b56;border-radius:22px;overflow:hidden;position:relative}
.about-experience:after{content:"";position:absolute;width:330px;height:330px;border:1px solid #29466a;border-radius:50%;right:-190px;top:-190px;box-shadow:0 0 0 25px #1a2a401c,0 0 0 55px #1a2a4010;pointer-events:none}
.about-orbit-wrap{display:flex;justify-content:center;align-items:center;min-height:310px;position:relative;z-index:1}
.about-orbit{width:260px;height:260px;border:0;background:transparent;position:relative;display:grid;place-items:center;cursor:pointer;color:#fff;transition:transform .75s cubic-bezier(.2,.8,.2,1);-webkit-tap-highlight-color:transparent}
.about-orbit:hover{transform:scale(1.035)}
.about-orbit.is-open{transform:rotate(13deg) scale(1.035)}
.orbit-ring{position:absolute;border:1px solid #4c82b7;border-radius:50%;inset:5px;transition:transform .8s,border-color .5s}
.ring-one{border-style:dashed;animation:orbitSpin 28s linear infinite}
.ring-two{inset:24px;border-color:#31577d;transform:rotate(28deg)}
.about-orbit.is-open .ring-two{transform:rotate(75deg) scale(1.06);border-color:#60a5fa}
.orbit-core{width:174px;height:174px;border-radius:50%;background:linear-gradient(145deg,#1d4167,#101b2b 72%);border:1px solid #5794ce;box-shadow:0 0 45px #2563eb35,inset 0 0 28px #60a5fa18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transform:rotate(0);transition:transform .75s}
.about-orbit.is-open .orbit-core{transform:rotate(-13deg)}
.orbit-kicker,.orbit-hint{font-size:9px;letter-spacing:2px;color:#9fc7ed;text-transform:uppercase}
.orbit-core strong{font-size:31px;line-height:.95;letter-spacing:2px}
.orbit-hint{letter-spacing:1px;font-size:9px}.orbit-hint span{font-size:14px;margin-left:4px}
.orbit-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#60a5fa;box-shadow:0 0 15px #60a5fa}
.dot-one{top:28px;left:56px}.dot-two{right:19px;top:116px;background:#a78bfa}.dot-three{bottom:26px;left:104px;background:#38bdf8}
.about-content{position:relative;z-index:1}.eyebrow{font-size:10px;letter-spacing:2.5px;color:#60a5fa;font-weight:bold;margin-bottom:13px}.about-content h2{font-size:clamp(25px,3vw,36px);line-height:1.15;color:#f8fafc;margin-bottom:14px}.about-content h2 span{color:#60a5fa}.about-lead{max-width:650px;color:#aab8ca;line-height:1.8;font-size:14px}
.about-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-height:0;opacity:0;transform:translateY(16px);overflow:hidden;transition:max-height .8s ease,opacity .55s ease,transform .65s ease;margin-top:0}
.about-panels.is-visible{max-height:520px;opacity:1;transform:translateY(0);margin-top:24px}
.about-panel{min-height:190px;padding:17px 15px;background:linear-gradient(155deg,#1b2d43,#121d2c);border:1px solid #2c4664;border-radius:13px;position:relative;overflow:hidden;animation:panelRise .55s both}
.about-panel:nth-child(2){animation-delay:.1s}.about-panel:nth-child(3){animation-delay:.2s}
.panel-number{font-size:8px;letter-spacing:1.5px;color:#7896b7}.panel-icon{font-size:24px;color:#60a5fa;margin:15px 0 9px}.about-panel h3{font-size:14px;color:#eaf4ff;margin-bottom:8px}.about-panel p{font-size:11px;line-height:1.6;color:#9aacc1}.panel-line{position:absolute;bottom:0;left:0;height:2px;width:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6,transparent)}
.panel-ai .panel-icon{color:#a78bfa}.panel-robotics .panel-icon{color:#38bdf8}
.about-bottom{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#0b1421;border:1px solid #263b56;border-radius:9px;color:#8ca8c6;font-size:9px;letter-spacing:1.6px}.bottom-mark{font-size:12px;color:#60a5fa;font-weight:bold}
.explore-about{margin-top:18px;border:1px solid #3b82f6;background:#173252;color:#dbeafe;padding:10px 15px;border-radius:7px;font-size:12px;cursor:pointer;transition:.25s}.explore-about:hover{background:#1d4b7b;transform:translateY(-2px)}.explore-about span{margin-left:12px;font-size:16px}
@keyframes orbitSpin{to{transform:rotate(360deg)}}@keyframes panelRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){.about-experience{grid-template-columns:1fr;gap:12px;padding:24px 18px}.about-orbit-wrap{min-height:270px}.about-orbit{width:230px;height:230px}.orbit-core{width:155px;height:155px}.about-panels{grid-template-columns:1fr}.about-panel{min-height:145px}.about-panels.is-visible{max-height:850px}.about-bottom{font-size:8px;letter-spacing:1px}}
@media(prefers-reduced-motion:reduce){.about-orbit,.orbit-ring,.orbit-core,.about-panels,.about-panel{animation:none!important;transition:none!important}}




</style>
</head>
