
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio | AI & Robotics</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0b0f19;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
}

header {
    padding: 55px 8%;
    background: #111827;
    border-bottom: 1px solid #263244;
}

header h1 {
    font-size: 38px;
    color: white;
}

header p {
    margin-top: 12px;
    color: #9ca3af;
    line-height: 1.7;
}

main {
    padding: 40px 8%;
}

.section-title {
    font-size: 25px;
    margin-bottom: 25px;
}

.projects {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
    gap: 22px;
}

.project-card {
    background: #151d2b;
    border: 1px solid #263244;
    border-radius: 12px;
    padding: 23px;
    cursor: pointer;
    transition: 0.2s;
}

.project-card:hover {
    transform: translateY(-5px);
    border-color: #3b82f6;
}

.project-card h3 {
    margin-bottom: 12px;
    color: #60a5fa;
}

.project-card p {
    color: #9ca3af;
    line-height: 1.6;
    font-size: 14px;
}

.tags {
    margin-top: 18px;
}

.tag {
    display: inline-block;
    background: #25334a;
    color: #93c5fd;
    padding: 5px 9px;
    border-radius: 5px;
    margin: 3px;
    font-size: 12px;
}

.details {
    display: none;
    margin-top: 35px;
    background: #151d2b;
    border: 1px solid #3b82f6;
    border-radius: 12px;
    padding: 25px;
}

.details h2 {
    color: #60a5fa;
    margin-bottom: 15px;
}

.details p {
    color: #cbd5e1;
    line-height: 1.8;
}

.details h3 {
    margin: 25px 0 12px;
}

.file-list {
    list-style: none;
}

.file-list li {
    padding: 12px;
    background: #202c3d;
    margin: 8px 0;
    border-radius: 6px;
}

.file-list a {
    color: #93c5fd;
    text-decoration: none;
}

.file-list a:hover {
    text-decoration: underline;
}

.close {
    margin-top: 25px;
    background: #263244;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    color: #6b7280;
    border-top: 1px solid #263244;
}

.profile-intro { display:flex; align-items:center; gap:28px; }
.profile-photo {
    width:180px; height:220px; object-fit:cover; object-position:center 38%;
    border-radius:12px; border:2px solid #263244; flex-shrink:0;
}
.profile-text h1 { font-size:38px; color:white; }
.profile-text .role { margin-top:10px; color:#60a5fa; font-size:18px; font-weight:bold; }
.profile-text p { margin-top:10px; color:#9ca3af; line-height:1.7; }
@media (max-width:600px) {
    .profile-intro { align-items:flex-start; gap:18px; }
    .profile-photo { width:118px; height:150px; }
    .profile-text h1 { font-size:27px; }
    .profile-text .role { font-size:15px; }
    .profile-text p { font-size:13px; }
}

</style>
</head>
